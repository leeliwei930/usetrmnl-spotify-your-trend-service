version: "3.8"

services:
  # ========================================
  # Python Agents Service
  # ========================================
  agents:
    image: usetrmnl-spotify-lyrics-agents
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: usetrmnl-agents
    ports:
      - "9301:8000"
    env_file:
      - .env.agents
    networks:
      - usetrmnl-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========================================
  # Go Backend Service
  # ========================================
  backend:
    image: usetrmnl-spotify-plugin-backend
    build:
      context: .
      dockerfile: Dockerfile
    container_name: usetrmnl-backend
    ports:
      - "9300:8080"
    env_file:
      - .env.backend
    depends_on:
      - agents
    networks:
      - usetrmnl-network
    restart: unless-stopped

  # ========================================
  # NuxtJS Frontend Service
  # ========================================
  frontend:
    image: usetrmnl-spotify-plugin-frontend
    build:
      context: ./frontend/usetrmnl_spotify_frontend
      dockerfile: Dockerfile
    container_name: usetrmnl-frontend
    ports:
      - "9302:3000"
    env_file:
      - .env.frontend
    depends_on:
      - backend
    networks:
      - usetrmnl-network
    restart: unless-stopped

# ========================================
# Networks
# ========================================
networks:
  usetrmnl-network:
    external: true
